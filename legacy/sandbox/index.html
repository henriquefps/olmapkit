<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Touch Polygon Editor · Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.0/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@10.6.0/dist/ol.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsts@2.7.1/dist/jsts.min.js"></script>
  <link rel="stylesheet" href="harness.css">
</head>
<body>
  <header class="toolbar">
    <strong>Touch Polygon Editor · demo</strong>
    <label>Scenario
      <select id="scenario"></select>
    </label>
    <button id="btn-reload" type="button">Reload map</button>
    <details class="flags">
      <summary>Parameters</summary>
      <div id="flags"></div>
    </details>
  </header>

  <main class="layout">
    <section class="map-column">
      <div class="help-tag" id="help-tag"></div>
      <div id="map" class="map">
        <div id="tooltip" class="tooltip"></div>
      </div>

      <!-- Simulated consumer screen: area + Save / Clear -->
      <div class="consumer">
        <div class="area">Area: <span id="area-ha">0</span> ha</div>
        <div class="actions">
          <button id="btn-clear" type="button">Clear drawing</button>
          <button id="btn-save" type="button" class="primary">Save</button>
        </div>
      </div>
      <div id="feedback" class="feedback" hidden></div>
    </section>

    <aside class="log-column">
      <h2>Events / $actions</h2>
      <button id="btn-clear-log" type="button">Clear log</button>
      <ol id="log" class="log"></ol>
    </aside>
  </main>

  <script src="harness.js"></script>
</body>
</html>
